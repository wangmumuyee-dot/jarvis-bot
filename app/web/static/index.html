<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#087f73" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jarvis 财务" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Jarvis 财务</title>
    <link rel="manifest" href="/finance-static/manifest.webmanifest" />
    <link rel="icon" href="/finance-static/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/finance-static/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/finance-static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <button class="icon-button menu-button" id="menuButton" type="button" title="打开菜单" aria-label="打开菜单" aria-expanded="false" aria-controls="sideMenu">
            <span aria-hidden="true">☰</span>
          </button>
          <div>
            <p class="eyebrow">Personal Jarvis</p>
            <h1 id="viewTitle">记账</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="authButton" type="button" title="访问口令" aria-label="访问口令">
            <span aria-hidden="true">K</span>
          </button>
          <button class="icon-button" id="refreshButton" type="button" title="刷新数据" aria-label="刷新数据">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <div class="menu-backdrop hidden" id="menuBackdrop"></div>
      <nav class="side-menu hidden" id="sideMenu" aria-label="财务功能菜单">
        <div class="menu-head">
          <strong>Jarvis 财务</strong>
          <button class="icon-button" id="closeMenuButton" type="button" title="关闭菜单" aria-label="关闭菜单">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <button class="menu-item active" type="button" data-view-target="record">记账</button>
        <button class="menu-item" type="button" data-view-target="entries">流水</button>
        <button class="menu-item" type="button" data-view-target="insights">洞察</button>
        <button class="menu-item" type="button" data-view-target="budget">预算</button>
        <button class="menu-item" type="button" data-view-target="debt">欠款</button>
        <button class="menu-item" type="button" data-view-target="saving">愿望</button>
        <button class="menu-item" type="button" data-view-target="tools">工具</button>
        <button class="menu-item" type="button" data-view-target="command">命令</button>
      </nav>

      <main class="workspace">
        <section class="summary-grid" aria-label="本月概览" data-view-panel="record insights">
          <article class="metric income">
            <span class="metric-label">本月收入</span>
            <strong id="incomeMetric">--</strong>
          </article>
          <article class="metric expense">
            <span class="metric-label">本月支出</span>
            <strong id="expenseMetric">--</strong>
          </article>
          <article class="metric net">
            <span class="metric-label">本月净额</span>
            <strong id="netMetric">--</strong>
          </article>
          <article class="metric reimburse">
            <span class="metric-label">待报销</span>
            <strong id="reimburseMetric">--</strong>
          </article>
        </section>

        <section class="primary-grid">
          <div class="panel entry-panel" data-view-panel="record">
            <div class="panel-head">
              <h2>快速记账</h2>
              <span id="periodLabel" class="soft-label">--</span>
            </div>

            <form id="entryForm" class="entry-form">
              <div class="segmented" id="entryTypeGroup" role="tablist" aria-label="流水类型">
                <button type="button" class="segment active" data-type="expense">支出</button>
                <button type="button" class="segment" data-type="income">收入</button>
                <button type="button" class="segment" data-type="refund">退款</button>
                <button type="button" class="segment" data-type="transfer">转账</button>
                <button type="button" class="segment" data-type="reimbursement">报销</button>
              </div>

              <input type="hidden" name="entry_type" id="entryType" value="expense" />

              <div class="form-grid">
                <label>
                  <span>金额</span>
                  <input name="amount" type="number" step="0.01" min="0.01" required placeholder="38" />
                </label>
                <label>
                  <span>币种</span>
                  <select name="currency" id="currencySelect"></select>
                </label>
                <label>
                  <span>分类</span>
                  <input name="category" id="categoryInput" list="categoryList" value="餐饮" />
                  <datalist id="categoryList"></datalist>
                </label>
                <label>
                  <span>日期</span>
                  <input name="occurred_at" type="date" id="occurredAt" />
                </label>
                <label>
                  <span>账户</span>
                  <input name="account" id="accountInput" list="accountList" value="默认账户" />
                  <datalist id="accountList"></datalist>
                </label>
                <label>
                  <span>账本</span>
                  <input name="book" id="bookInput" list="bookList" value="日常账本" />
                  <datalist id="bookList"></datalist>
                </label>
              </div>

              <label class="wide-label">
                <span>备注</span>
                <input name="note" placeholder="午饭、打车、工资到账..." />
              </label>

              <div class="form-grid secondary-fields">
                <label>
                  <span>转入账户</span>
                  <input name="transfer_to_account" list="accountList" placeholder="转账时填写" />
                </label>
                <label>
                  <span>标签</span>
                  <input name="tags" placeholder="出差, 618" />
                </label>
              </div>

              <label class="checkbox-row">
                <input type="checkbox" name="reimbursable" />
                <span>待报销</span>
              </label>

              <button class="primary-button" type="submit">保存流水</button>
            </form>
          </div>

          <div class="panel command-panel" data-view-panel="command">
            <div class="panel-head">
              <h2>命令</h2>
              <span class="soft-label">复用飞书指令</span>
            </div>
            <form id="commandForm" class="command-form">
              <textarea id="commandText" name="text" rows="4" placeholder="例如：设置本月餐饮预算 2000"></textarea>
              <button class="primary-button" type="submit">执行命令</button>
            </form>
            <div class="quick-actions" id="quickActions"></div>
            <pre id="replyBox" class="reply-box">等待操作</pre>
          </div>
        </section>

        <section class="tools-grid" aria-label="财务工具">
          <div class="panel tool-panel" data-view-panel="budget">
            <div class="panel-head">
              <h2>预算</h2>
              <button class="text-button" data-command="这个月餐饮还剩多少预算？" type="button">查询</button>
            </div>
            <form id="budgetToolForm" class="tool-form">
              <label>
                <span>分类</span>
                <input name="category" list="categoryList" value="餐饮" />
              </label>
              <label>
                <span>金额</span>
                <input name="amount" type="number" step="0.01" min="0.01" placeholder="2000" required />
              </label>
              <button class="secondary-button" type="submit">保存预算</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="debt">
            <div class="panel-head">
              <h2>欠款</h2>
              <button class="text-button" data-command="有哪些欠款" type="button">列表</button>
            </div>
            <form id="debtToolForm" class="tool-form">
              <label>
                <span>动作</span>
                <select name="action">
                  <option value="lend">我借出</option>
                  <option value="borrow">我借入</option>
                  <option value="lend_repay">对方还我</option>
                  <option value="borrow_repay">我还对方</option>
                </select>
              </label>
              <label>
                <span>对象</span>
                <input name="person" placeholder="小王" required />
              </label>
              <label>
                <span>金额</span>
                <input name="amount" type="number" step="0.01" min="0.01" placeholder="500" required />
              </label>
              <button class="secondary-button" type="submit">保存欠款</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="saving">
            <div class="panel-head">
              <h2>愿望</h2>
              <button class="text-button" data-command="查看愿望清单" type="button">清单</button>
            </div>
            <form id="savingToolForm" class="tool-form">
              <label>
                <span>动作</span>
                <select name="action">
                  <option value="create">创建目标</option>
                  <option value="add">存入</option>
                  <option value="progress">进度</option>
                </select>
              </label>
              <label>
                <span>名称</span>
                <input name="name" placeholder="相机" required />
              </label>
              <label>
                <span>金额</span>
                <input name="amount" type="number" step="0.01" min="0.01" placeholder="5000" />
              </label>
              <button class="secondary-button" type="submit">更新愿望</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="tools">
            <div class="panel-head">
              <h2>模板</h2>
              <button class="text-button" data-command="查看快捷模板列表" type="button">列表</button>
            </div>
            <form id="templateToolForm" class="tool-form">
              <label>
                <span>名称</span>
                <input name="name" placeholder="午饭" required />
              </label>
              <label class="span-2">
                <span>命令</span>
                <input name="command" placeholder="今天午饭 38" required />
              </label>
              <button class="secondary-button" type="submit">保存模板</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="tools">
            <div class="panel-head">
              <h2>周期</h2>
              <button class="text-button" data-command="生成本月周期账单" type="button">生成</button>
            </div>
            <form id="recurringToolForm" class="tool-form">
              <label>
                <span>每月</span>
                <input name="day" type="number" min="1" max="31" value="1" required />
              </label>
              <label>
                <span>金额</span>
                <input name="amount" type="number" step="0.01" min="0.01" placeholder="3000" required />
              </label>
              <label class="span-2">
                <span>备注</span>
                <input name="note" placeholder="房租" required />
              </label>
              <button class="secondary-button" type="submit">保存周期账单</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="tools">
            <div class="panel-head">
              <h2>批处理</h2>
              <button class="text-button" data-command="同步状态" type="button">同步</button>
            </div>
            <form id="importToolForm" class="import-form">
              <label>
                <span>Excel 导入</span>
                <input name="file" type="file" accept=".xlsx" />
              </label>
              <button type="submit" class="secondary-button">上传导入</button>
            </form>
            <div class="button-grid">
              <button type="button" class="secondary-button" data-export-scope="month">本月下载</button>
              <button type="button" class="secondary-button" data-export-scope="all">全部下载</button>
              <button type="button" class="secondary-button" data-export-scope="reimbursable">报销下载</button>
              <button type="button" class="secondary-button" data-export-scope="all" data-export-redact="true">脱敏下载</button>
              <button type="button" class="secondary-button" data-command="生成本月财务月报">月报</button>
              <button type="button" class="secondary-button" data-command="分析本月消费">分析</button>
              <button type="button" class="secondary-button" data-command="财务周期设置">周期设置</button>
            </div>
          </div>

          <div class="panel tool-panel" data-view-panel="tools">
            <div class="panel-head">
              <h2>账户</h2>
              <button class="text-button" data-command="默认账户余额多少" type="button">余额</button>
            </div>
            <form id="accountToolForm" class="tool-form">
              <label>
                <span>动作</span>
                <select name="action">
                  <option value="balance">查询余额</option>
                  <option value="opening">设置初始余额</option>
                </select>
              </label>
              <label>
                <span>账户</span>
                <input name="account" list="accountList" value="默认账户" required />
              </label>
              <label>
                <span>金额</span>
                <input name="amount" type="number" step="0.01" min="0" placeholder="1000" />
              </label>
              <button class="secondary-button" type="submit">处理账户</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="tools">
            <div class="panel-head">
              <h2>分类</h2>
              <button class="text-button" data-command="有哪些分类" type="button">列表</button>
            </div>
            <form id="categoryToolForm" class="tool-form">
              <label>
                <span>动作</span>
                <select name="action">
                  <option value="add">新增</option>
                  <option value="hide">隐藏</option>
                </select>
              </label>
              <label>
                <span>分类</span>
                <input name="category" placeholder="宠物" required />
              </label>
              <label>
                <span>父级</span>
                <input name="parent" placeholder="生活" />
              </label>
              <button class="secondary-button" type="submit">处理分类</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="tools">
            <div class="panel-head">
              <h2>信用卡</h2>
              <button class="text-button" data-command="信用卡还款日" type="button">查询</button>
            </div>
            <form id="cardToolForm" class="tool-form">
              <label>
                <span>信用卡</span>
                <input name="account" list="accountList" placeholder="招行信用卡" required />
              </label>
              <label>
                <span>账单日</span>
                <input name="statement_day" type="number" min="1" max="31" placeholder="5" required />
              </label>
              <label>
                <span>还款日</span>
                <input name="repayment_day" type="number" min="1" max="31" placeholder="25" required />
              </label>
              <button class="secondary-button" type="submit">保存卡片</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="tools">
            <div class="panel-head">
              <h2>周期设置</h2>
              <button class="text-button" data-command="财务周期设置" type="button">查看</button>
            </div>
            <form id="periodToolForm" class="tool-form">
              <label>
                <span>财务月</span>
                <input name="month_start" type="number" min="1" max="31" placeholder="5" />
              </label>
              <label>
                <span>财务周</span>
                <select name="week_start">
                  <option value="">不修改</option>
                  <option value="周一">周一</option>
                  <option value="周二">周二</option>
                  <option value="周三">周三</option>
                  <option value="周四">周四</option>
                  <option value="周五">周五</option>
                  <option value="周六">周六</option>
                  <option value="周日">周日</option>
                </select>
              </label>
              <button class="secondary-button" type="submit">保存周期</button>
            </form>
          </div>

          <div class="panel tool-panel" data-view-panel="tools entries">
            <div class="panel-head">
              <h2>搜索</h2>
              <button class="text-button" data-command="本月账单日历" type="button">日历</button>
            </div>
            <form id="searchToolForm" class="tool-form">
              <label class="span-2">
                <span>关键词</span>
                <input name="keyword" placeholder="出差、午饭、咖啡" required />
              </label>
              <button class="secondary-button" type="submit">搜索账单</button>
            </form>
          </div>
        </section>

        <section class="detail-grid">
          <div class="panel entries-panel" data-view-panel="entries">
            <div class="panel-head">
              <h2>最近流水</h2>
              <span class="soft-label" id="entryCountLabel">--</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>类型</th>
                    <th>分类</th>
                    <th>备注</th>
                    <th>账户</th>
                    <th class="number-cell">金额</th>
                  </tr>
                </thead>
                <tbody id="entriesBody"></tbody>
              </table>
            </div>
          </div>

          <aside class="side-stack">
            <div class="panel" data-view-panel="budget insights">
              <div class="panel-head">
                <h2>预算</h2>
                <button class="text-button" data-command="设置本月餐饮预算 2000" type="button">设置</button>
              </div>
              <div id="budgetList" class="progress-list"></div>
            </div>

            <div class="panel" data-view-panel="insights">
              <div class="panel-head">
                <h2>分类</h2>
                <button class="text-button" data-command="本月分类统计" type="button">统计</button>
              </div>
              <div id="categoryListPanel" class="category-bars"></div>
            </div>

            <div class="panel" data-view-panel="saving insights">
              <div class="panel-head">
                <h2>愿望</h2>
                <button class="text-button" data-command="查看愿望清单" type="button">查看</button>
              </div>
              <div id="savingList" class="progress-list"></div>
            </div>

            <div class="panel" data-view-panel="debt insights">
              <div class="panel-head">
                <h2>欠款</h2>
                <button class="text-button" data-command="有哪些欠款" type="button">查询</button>
              </div>
              <div id="debtList" class="compact-list"></div>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <div class="auth-overlay hidden" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <form class="auth-card" id="authForm">
        <p class="eyebrow">Protected</p>
        <h2 id="authTitle">输入财务网页访问口令</h2>
        <label>
          <span>口令</span>
          <input id="authTokenInput" name="token" type="password" autocomplete="current-password" required />
        </label>
        <div class="auth-actions">
          <button class="secondary-button" id="clearAuthButton" type="button">清除</button>
          <button class="primary-button" type="submit">保存并继续</button>
        </div>
      </form>
    </div>

    <script src="/finance-static/app.js" defer></script>
  </body>
</html>
