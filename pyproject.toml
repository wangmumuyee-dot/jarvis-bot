[project]
name = "personal-jarvis-bot"
version = "0.1.0"
description = "Feishu-based personal Jarvis MVP for ledger, todos, reminders, and Obsidian capture."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

